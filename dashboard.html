<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Owner dashboard</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--ac:#3b5bdb;--ok:#2f9e44;--no:#e8590c;--bd:#e3e6ef}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1c212c;--tx:#eef0f6;--mu:#98a0b3;--ac:#748ffc;--ok:#51cf66;--no:#ff922b;--bd:#2c3342}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR","Noto Sans Devanagari",system-ui,sans-serif;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:14px}h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}.hide{display:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.grid b{display:block;font-size:24px}.grid span{font-size:12px;color:var(--mu)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;font-size:14px}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.row .l{width:70px;flex:none}.row .bar{flex:1}.row .v{width:34px;text-align:right;flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mu);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--bd)}td{padding:7px 4px;border-bottom:1px solid var(--bd);vertical-align:middle}
.wrap{overflow-x:auto}.chip{display:inline-block;padding:2px 8px;border:1px solid var(--bd);border-radius:12px;margin:2px;font-size:13px}
.act{color:var(--ok)}.old{color:var(--no)}
</style></head><body><main>
<h1>📊 Owner dashboard · Korean Word App</h1>
<div class="card" id="login"><b>Enter your passcode</b><p class="mu">This is the passcode you wrote in your Google script (ADMIN_KEY).</p>
<input type="password" id="pw" placeholder="Passcode" autocomplete="current-password"><button id="go">Open dashboard</button><p class="mu" id="msg"></p></div>
<div id="dash" class="hide"></div>
<script src="sync-config.js"></script>
<script>
var URL_=window.SYNC_URL||"",MEANS={},ROWS=[],GEN="";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ago(ms){var m=Math.floor(ms/60000);if(m<1)return"just now";if(m<60)return m+" min ago";var h=Math.floor(m/60);if(h<24)return h+" h ago";var d=Math.floor(h/24);return d+" day"+(d>1?"s":"")+" ago"}
function calc(rows,now){
 var t0=new Date(now);t0.setHours(0,0,0,0);var day=86400000,n=rows.length;
 var R=rows.map(function(r){var o=Object.assign({},r);o.ls=new Date(r.lastSeen).getTime()||0;o.fs=new Date(r.firstSeen).getTime()||0;return o});
 var sum=function(f){return R.reduce(function(a,r){return a+(Number(r[f])||0)},0)};
 var joined={};for(var i=13;i>=0;i--){var d=new Date(t0.getTime()-i*day);joined[d.getMonth()+1+"/"+d.getDate()]=0}
 R.forEach(function(r){if(!r.fs)return;var d=new Date(r.fs);var k=d.getMonth()+1+"/"+d.getDate();if(k in joined&&now-r.fs<14*day)joined[k]++});
 var sets={};R.forEach(function(r){var k=r.curSet||1;sets[k]=(sets[k]||0)+1});
 var hard={};R.forEach(function(r){(r.hard||[]).forEach(function(w){hard[w]=(hard[w]||0)+1})});
 var hardList=Object.keys(hard).map(function(w){return[w,hard[w]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,20);
 return {rows:R,total:n,activeToday:R.filter(function(r){return r.ls>=t0.getTime()}).length,active7:R.filter(function(r){return now-r.ls<7*day}).length,new7:R.filter(function(r){return r.fs&&now-r.fs<7*day}).length,inactive7:R.filter(function(r){return now-r.ls>=7*day}).length,avgKnown:n?Math.round(sum("known")/n):0,avgStreak:n?Math.round(sum("streak")/n*10)/10:0,avgGame:n?Math.round(sum("gamePct")/n):0,joined:joined,sets:sets,hard:hardList}}
function msg(t){document.getElementById("msg").textContent=t}
function load(key){
 if(!URL_){msg("The web app URL is empty. Edit sync-config.js and paste your Google web app URL.");return}
 msg("Loading…");
 fetch(URL_+"?action=dashboard&key="+encodeURIComponent(key)).then(function(r){return r.json()}).then(function(d){
  if(!d.ok){msg(d.error==="wrong passcode"?"Wrong passcode":"Error: "+d.error);return}
  try{sessionStorage.setItem("kwkey",key)}catch(e){}
  ROWS=d.rows||[];GEN=d.generated;document.getElementById("login").classList.add("hide");render()
 }).catch(function(){msg("Could not reach Google. Check the URL in sync-config.js and your internet.")})}
function render(){
 var C=calc(ROWS,Date.now()),el=document.getElementById("dash"),q=(document.getElementById("q")||{}).value||"",sort=(document.getElementById("so")||{}).value||"known";
 var h='<div class="card"><div class="grid"><div><b>'+C.total+'</b><span>Users</span></div><div><b>'+C.activeToday+'</b><span>Active today</span></div><div><b>'+C.active7+'</b><span>Active 7 days</span></div><div><b>'+C.new7+'</b><span>New this week</span></div><div><b>'+C.avgKnown+'</b><span>Avg words known</span></div><div><b>'+C.avgGame+'%</b><span>Avg game score</span></div></div>';
 h+='<p class="mu" style="margin:10px 0 0">Updated '+esc(new Date().toLocaleTimeString())+' · <button class="g" id="rf" style="padding:6px 10px">Refresh</button> <button class="g" id="lo" style="padding:6px 10px">Log out</button></p></div>';
 var mx=Math.max.apply(null,Object.keys(C.joined).map(function(k){return C.joined[k]}).concat([1]));
 h+='<div class="card"><h2>New users, last 14 days</h2>'+Object.keys(C.joined).map(function(k){return '<div class="row"><span class="l">'+k+'</span><div class="bar"><i style="width:'+Math.round(C.joined[k]/mx*100)+'%"></i></div><span class="v">'+C.joined[k]+'</span></div>'}).join("")+'</div>';
 var sk=Object.keys(C.sets).map(Number).sort(function(a,b){return a-b}),sm=Math.max.apply(null,sk.map(function(k){return C.sets[k]}).concat([1]));
 h+='<div class="card"><h2>Where people are (current set)</h2>'+(sk.length?sk.map(function(k){return '<div class="row"><span class="l">Set '+k+'</span><div class="bar"><i style="width:'+Math.round(C.sets[k]/sm*100)+'%"></i></div><span class="v">'+C.sets[k]+'</span></div>'}).join(""):'<p class="mu">No data yet.</p>')+'</div>';
 h+='<div class="card"><h2>Words many people find hard</h2>'+(C.hard.length?C.hard.map(function(x){return '<span class="chip">'+esc(x[0])+(MEANS[x[0]]?' <span class="mu">'+esc(MEANS[x[0]])+'</span>':'')+' · '+x[1]+'</span>'}).join(""):'<p class="mu">No data yet.</p>')+'<p class="mu">The number is how many users have the word in their 10 hardest.</p></div>';
 var rows=C.rows.filter(function(r){return !q||String(r.nick).toLowerCase().indexOf(q.toLowerCase())>-1});
 var cmp={known:function(a,b){return b.known-a.known},last:function(a,b){return b.ls-a.ls},streak:function(a,b){return b.streak-a.streak},game:function(a,b){return b.gamePct-a.gamePct},newest:function(a,b){return b.fs-a.fs},inactive:function(a,b){return a.ls-b.ls}}[sort];
 rows.sort(cmp);var now=Date.now();
 h+='<div class="card"><h2>Users ('+rows.length+')</h2><input id="q" placeholder="Search nickname" value="'+esc(q)+'"><select id="so">'+[["known","Most words known"],["last","Last active"],["streak","Longest streak"],["game","Best game score"],["newest","Newest"],["inactive","Least recently active"]].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===sort?' selected':'')+'>'+o[1]+'</option>'}).join("")+'</select><div class="wrap"><table><tr><th>Nickname</th><th>Known</th><th>Set</th><th>🔥</th><th>Game</th><th>Last active</th></tr>'+rows.map(function(r){var age=now-r.ls;return '<tr><td><b>'+esc(r.nick)+'</b><div class="mu">v'+esc(r.ver)+'</div></td><td style="min-width:90px">'+r.known+' / '+r.total+'<div class="bar"><i style="width:'+(r.total?Math.round(r.known/r.total*100):0)+'%"></i></div></td><td>'+r.curSet+'</td><td>'+r.streak+'</td><td>'+r.gamePct+'%</td><td class="'+(age<7*86400000?'act':'old')+'">'+ago(age)+'</td></tr>'}).join("")+'</table></div></div>';
 el.innerHTML=h;el.classList.remove("hide");
 document.getElementById("rf").onclick=function(){load(sessionStorage.getItem("kwkey")||"")};
 document.getElementById("lo").onclick=function(){try{sessionStorage.removeItem("kwkey")}catch(e){}location.reload()};
 document.getElementById("q").oninput=function(){var p=this.selectionStart;render();var n=document.getElementById("q");n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
 document.getElementById("so").onchange=render}
document.getElementById("go").onclick=function(){var k=document.getElementById("pw").value;if(!k){msg("Type your passcode");return}load(k)};
document.getElementById("pw").onkeydown=function(e){if(e.key==="Enter")document.getElementById("go").onclick()};
try{fetch("index.html").then(function(r){return r.text()}).then(function(t){var m=t.match(/var BASE=`([\s\S]*?)`;/);if(m)m[1].split("\n").forEach(function(l){var a=l.split("|");if(a[1])MEANS[a[0]]=a[1].split(/[;,]/)[0]})}).catch(function(){})}catch(e){}
try{var sk=sessionStorage.getItem("kwkey");if(sk)load(sk)}catch(e){}
</script></main></body></html>

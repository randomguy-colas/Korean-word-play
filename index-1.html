 for(var i=0;i<all.length;i+=25){var s=all.slice(i,i+25),k=s.filter(function(w){return known[w[0]]}).length;h+='<div class="set"><span style="width:78px">'+(i/25==curSet()?'▶ ':'')+'Set '+(i/25+1)+'</span><div class="bar"><i style="width:'+Math.round(k/s.length*100)+'%"></i></div><span>'+k+'/'+s.length+'</span></div>'}
 h+='</div>';
 var hard=all.filter(function(w){return rep[w[0]]&&!known[w[0]]}).sort(function(a,b){return rep[b[0]]-rep[a[0]]}).slice(0,10);
 h+='<div class="card"><b>Hardest words (most repeated, not yet known)</b>'+(hard.length?hard.map(function(w){return '<div class="w"><div class="k">'+esc(w[0])+'</div><div class="m">'+esc(w[1])+'<br><span>'+esc(w[2])+'</span></div><span class="mu">×'+rep[w[0]]+'</span></div>'}).join(""):'<p class="mu" style="text-align:left">None yet. Words you press 🔁 Repeat on will appear here.</p>')+'</div>';
 h+='<div class="card"><b>🎯 Word Hunt game</b><div class="stats" style="margin-top:8px"><div><b>'+game.best+'</b><span class="mu">Best streak</span></div><div><b>'+game.score+'/10</b><span class="mu">Best score</span></div><div><b>'+game.plays+'</b><span class="mu">Games</span></div></div></div>';
 document.getElementById("stats").innerHTML=h;
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x==b)});["learn","list","rel","game","stats","add"].forEach(function(id){document.getElementById(id).classList.toggle("hide",id!=b.dataset.t)});if(b.dataset.t=="learn")learn();if(b.dataset.t=="list")list();if(b.dataset.t=="rel")relTab();if(b.dataset.t=="game")gameTab();if(b.dataset.t=="stats")stats()}});
document.getElementById("addbtn").onclick=function(){
 var n=0,have={};words().forEach(function(w){have[w[0]]=1});
 document.getElementById("ta").value.split("\n").forEach(function(l){var a=l.split("|").map(function(x){return x.trim()});if(a.length>=3&&a[0]&&a[1]&&a[2]&&!have[a[0]]){custom.push(a.slice(0,3));have[a[0]]=1;n++}});
 P("kw_custom",custom);queue=null;document.getElementById("ta").value="";document.getElementById("addmsg").textContent=n+" word(s) added.";
};
document.getElementById("reset").onclick=function(){if(confirm("Reset all progress?")){known={};rep={};save();queue=null;document.getElementById("addmsg").textContent="Progress reset."}};

function bm(t){document.getElementById("bkmsg").textContent=t}
document.getElementById("bkshow").onclick=function(){document.getElementById("bk").value=JSON.stringify({v:1,known:known,rep:rep,custom:custom,game:game});bm("Backup ready. Tap Copy.")};
document.getElementById("bkcopy").onclick=function(){var t=document.getElementById("bk");if(!t.value)document.getElementById("bkshow").onclick();t.select();try{navigator.clipboard.writeText(t.value).then(function(){bm("Copied.")},function(){document.execCommand("copy");bm("Copied.")})}catch(e){try{document.execCommand("copy");bm("Copied.")}catch(x){bm("Select the text and copy it manually.")}}};
document.getElementById("bkrest").onclick=function(){try{var d=JSON.parse(document.getElementById("bk").value);if(!d||typeof d.known!="object"||typeof d.rep!="object"||!Array.isArray(d.custom))throw 1;known=d.known;rep=d.rep;if(d.game&&typeof d.game=="object"){game=d.game;P("kw_game",game)}custom=d.custom.filter(function(a){return Array.isArray(a)&&a.length>=3});save();P("kw_custom",custom);queue=null;bm("Restored: "+Object.keys(known).length+" known words.")}catch(e){bm("That backup text is not valid.")}};
document.getElementById("vn").onclick=function(e){if(!e.target||e.target.tagName!="A")this.style.display="none"};
